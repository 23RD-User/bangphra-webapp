<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เทศบาลตำบลบางพระ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Sarabun',sans-serif; }
        body {
            background:#0A0F1A;
            display:flex; justify-content:center;
            min-height:100vh;
        }
        .splash-container {
            width:100%; max-width:450px; min-height:100vh;
            background:linear-gradient(160deg, #1C2B4A 0%, #0F1A2E 60%, #0A0F1A 100%);
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            position:relative; overflow:hidden;
        }
        /* วงกลมพื้นหลัง */
        .bg-circle {
            position:absolute; border-radius:50%;
            background:rgba(232,73,30,0.06); pointer-events:none;
        }
        .bc-1 { width:340px; height:340px; top:-80px; right:-80px; }
        .bc-2 { width:200px; height:200px; bottom:60px; left:-60px; }
        .bc-3 { width:120px; height:120px; top:40%; left:20px; background:rgba(255,255,255,0.03); }

        .splash-content {
            display:flex; flex-direction:column;
            align-items:center; gap:16px; z-index:1;
            animation:fadeUp 0.6s ease forwards;
        }
        .splash-logo {
            width:88px; height:88px;
            background:#E8491E;
            border-radius:22px;
            display:flex; align-items:center; justify-content:center;
            font-size:40px;
            box-shadow:0 8px 32px rgba(232,73,30,0.4);
        }
        .splash-title {
            color:white; font-size:22px; font-weight:800;
            text-align:center; line-height:1.4;
        }
        .splash-subtitle {
            color:rgba(255,255,255,0.5);
            font-size:14px; text-align:center;
            margin-top:-8px;
        }
        /* Loading dots */
        .loading-dots { display:flex; gap:8px; margin-top:4px; }
        .dot {
            width:8px; height:8px;
            background:rgba(255,255,255,0.25);
            border-radius:50%;
            animation:dotPulse 1.1s ease-in-out infinite;
        }
        .dot:nth-child(1) { animation-delay:0s; }
        .dot:nth-child(2) { animation-delay:0.18s; }
        .dot:nth-child(3) { animation-delay:0.36s; }

        /* Progress bar */
        .progress-wrap {
            position:absolute; bottom:48px;
            width:130px; height:3px;
            background:rgba(255,255,255,0.12);
            border-radius:99px; overflow:hidden; z-index:1;
        }
        .progress-fill {
            height:100%; width:0%;
            background:#E8491E;
            border-radius:99px;
            animation:fillBar 1.4s ease forwards;
        }

        /* org sub label */
        .org-sub {
            font-size:12px; color:rgba(255,255,255,0.35);
            letter-spacing:0.5px; margin-top:-10px;
        }

        @keyframes fadeUp {
            from { opacity:0; transform:translateY(24px); }
            to   { opacity:1; transform:translateY(0); }
        }
        @keyframes dotPulse {
            0%,80%,100% { transform:scale(0.7); opacity:0.3; }
            40%          { transform:scale(1.2); opacity:1; background:#E8491E; }
        }
        @keyframes fillBar {
            0%   { width:0%; }
            100% { width:100%; }
        }
        .splash-container.fade-out {
            animation:fadeOut 0.35s ease forwards;
        }
        @keyframes fadeOut {
            to { opacity:0; transform:scale(1.02); }
        }
    </style>
</head>
<body>
    <div class="splash-container" id="splash">
        <div class="bg-circle bc-1"></div>
        <div class="bg-circle bc-2"></div>
        <div class="bg-circle bc-3"></div>

        <div class="splash-content">
            <div class="splash-logo">
                <i class="fa-solid fa-building-columns" style="color:white;"></i>
            </div>
            <div>
                <div class="splash-title">เทศบาลตำบลบางพระ</div>
                <div class="splash-subtitle">Bangphra Municipality</div>
            </div>
            <div class="org-sub">บริการประชาชน ออนไลน์</div>
            <div class="loading-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <div class="progress-wrap">
            <div class="progress-fill"></div>
        </div>
    </div>

    <script>
        setTimeout(function() {
            document.getElementById('splash').classList.add('fade-out');
            setTimeout(function() {
                window.location.href = 'index.html';
            }, 350);
        }, 1500);
    </script>
</body>
</html>
